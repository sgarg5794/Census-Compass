name: school_enrollment_2019
title: School enrollment (2019)
description: 'ACS 5-year estimates, survey answers collected 2015–2019, for each Census block group: sex
  by school enrollment by level of school by type of school for the population 3 years and over; sex by
  school enrollment by educational attainment by employment status for the population 16 to 19 years;
  school enrollment by detailed level of school for the population 3 years and over. Some of these are
  also given by race and Hispanic origin.'
