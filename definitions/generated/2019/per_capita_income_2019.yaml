- name: per_capita_income
  title: Per capita income
  description: 'Average income per person in the past 12 months: total income of people 15 years and over
    divided by the total population, children included.'
  sql: SUM(IFF("2019_CBG_B19"."B19313e1" IS NULL OR "2019_CBG_B01"."B01003e1" IS NULL, NULL, "2019_CBG_B19"."B19313e1"))
    / NULLIF(SUM(IFF("2019_CBG_B19"."B19313e1" IS NULL OR "2019_CBG_B01"."B01003e1" IS NULL, NULL, "2019_CBG_B01"."B01003e1")),
    0)
  type: number
  format: currency
  meta:
    universe: Total population
