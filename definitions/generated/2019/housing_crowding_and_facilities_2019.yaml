  by occupants per room; tenure by age of householder by occupants per room; tenure by plumbing facilities
  by occupants per room; house heating fuel; tenure by telephone service available by age of householder;
  plumbing facilities for all housing units; tenure by plumbing facilities; plumbing facilities by occupants
  per room by year structure built; kitchen facilities for all housing units; tenure by kitchen facilities.'
