  facilities by meals included in rent; age of householder by meals included in rent; contract rent; lower
  contract rent quartile (dollars); median contract rent (dollars); upper contract rent quartile (dollars);
  aggregate contract rent (dollars); rent asked; aggregate rent asked (dollars); gross rent; median gross
  rent (dollars); aggregate gross rent (dollars); aggregate gross rent (dollars) by units in structure;
  aggregate gross rent (dollars) by meals included in rent; bedrooms by gross rent; inclusion of utilities
  in rent; gross rent as a percentage of household income; median gross rent as a percentage of household
  income (dollars); age of householder by gross rent as a percentage of household income; household income
  by gross rent as a percentage of household income.'
