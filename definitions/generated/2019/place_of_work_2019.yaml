name: place_of_work_2019
title: Where workers work (state, county, place, metro area) (2019)
description: 'ACS 5-year estimates, survey answers collected 2015–2019, for each Census block group: sex
  of workers by place of work--state and county level; sex of workers by place of work--place level; sex
  of workers by place of work--minor civil division level for 12 selected states (CT, ME, MA, MI, MN,
  NH, NJ, NY, PA, RI, VT, WI); place of work for workers 16 years and over--metropolitan statistical area
  level; place of work for workers 16 years and over--micropolitan statistical area level; place of work
  for workers 16 years and over--not metropolitan or micropolitan statistical area level.'
sql_table: '"US_OPEN_CENSUS_DATA_NEIGHBORHOOD_INSIGHTS_FREE_DATASET"."PUBLIC"."2019_CBG_B08"'
