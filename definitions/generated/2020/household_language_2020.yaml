- name: limited_english_households_pct
  title: Limited-English-speaking households (%)
  description: Percentage of households in which no one 14 years and over speaks only English or speaks
    English "very well", across Spanish, other Indo-European, Asian and Pacific Island, and other languages.
  sql: 100 * SUM(IFF("2020_CBG_C16"."C16002e4" IS NULL OR "2020_CBG_C16"."C16002e7" IS NULL OR "2020_CBG_C16"."C16002e10"
    IS NULL OR "2020_CBG_C16"."C16002e13" IS NULL OR "2020_CBG_C16"."C16002e1" IS NULL, NULL, "2020_CBG_C16"."C16002e4"
    + "2020_CBG_C16"."C16002e7" + "2020_CBG_C16"."C16002e10" + "2020_CBG_C16"."C16002e13")) / NULLIF(SUM(IFF("2020_CBG_C16"."C16002e4"
    IS NULL OR "2020_CBG_C16"."C16002e7" IS NULL OR "2020_CBG_C16"."C16002e10" IS NULL OR "2020_CBG_C16"."C16002e13"
    IS NULL OR "2020_CBG_C16"."C16002e1" IS NULL, NULL, "2020_CBG_C16"."C16002e1")), 0)
  type: number
  format: percent
  meta:
    universe: Households
