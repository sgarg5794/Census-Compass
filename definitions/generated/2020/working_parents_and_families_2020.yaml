  of own children under 18 years by age of own children under 18 years by employment status for females
  20 to 64 years; presence of own children under 18 years by family type by employment status; age of
  own children under 18 years in families and subfamilies by living arrangements by employment status
  of parents; presence of own children under 18 years by family type by number of workers in family.'
