  title: Poverty rate (people)
  description: Percentage of people whose income in the past 12 months was below the poverty level, out
    of all people for whom poverty status is determined.
  sql: 100 * SUM(IFF("2020_CBG_B17"."B17021e2" IS NULL OR "2020_CBG_B17"."B17021e1" IS NULL, NULL, "2020_CBG_B17"."B17021e2"))
