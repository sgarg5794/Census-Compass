name: commuting_2020
title: 'Getting to work: transport mode, travel time and departure time (2020)'
description: 'ACS 5-year estimates, survey answers collected 2016–2020, for each Census block group: means
  of transportation to work by travel time to work; aggregate travel time to work (in minutes) of workers
  by travel time to work; aggregate travel time to work (in minutes) of workers by means of transportation
  to work; means of transportation to work; time of departure to go to work; travel time to work.'
