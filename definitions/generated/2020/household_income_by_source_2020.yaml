  for households; wage or salary income for households; self-employment income for households; interest,
  dividends, or net rental income for households; Social Security income for households; supplemental
  security income (SSI) for households; public assistance income for households; public assistance income
  or food stamps/SNAP for households; retirement income for households; other types of income for households;
  aggregate earnings for households; aggregate wage or salary income for households; aggregate self-employment
  income for households; aggregate interest, dividends, or net rental income for households; aggregate
  Social Security income for households; aggregate supplemental security income (SSI) for households;
  aggregate public assistance income for households; aggregate retirement income for households; aggregate
  other types of income for households.'
