- name: mean_household_earnings
  title: Mean household earnings
  description: 'Average earnings in the past 12 months of households that had earnings: their total earnings
    divided by the number of households with earnings.'
  sql: SUM(IFF("2020_CBG_B19"."B19061e1" IS NULL OR "2020_CBG_B19"."B19051e2" IS NULL, NULL, "2020_CBG_B19"."B19061e1"))
    / NULLIF(SUM(IFF("2020_CBG_B19"."B19061e1" IS NULL OR "2020_CBG_B19"."B19051e2" IS NULL, NULL, "2020_CBG_B19"."B19051e2")),
    0)
  type: number
  format: currency
  meta:
    universe: Households with earnings
