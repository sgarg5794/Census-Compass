name: children_and_living_arrangements_2020
title: Children, older adults and living arrangements (2020)
description: 'ACS 5-year estimates, survey answers collected 2016–2020, for each Census block group: own
  children under 18 years by family type and age; relationship to householder for children under 18 years
  in households; household type (including living alone) by relationship; relationship by household type
  (including living alone) for the population 65 years and over; living arrangements of adults 18 years
  and over by age.'
