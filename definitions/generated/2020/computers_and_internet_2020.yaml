name: computers_and_internet_2020
title: Computers and internet subscriptions (2020)
description: 'ACS 5-year estimates, survey answers collected 2016–2020, for each Census block group: types
  of computers in household; presence and types of internet subscriptions in household; presence of a
  computer and type of internet subscription in household; household income by presence and type of internet
  subscription in household; age by presence of a computer and types of internet subscription in household;
  educational attainment by presence of a computer and types of internet subscription in household; labor
  force status by presence of a computer and types of internet subscription in household; computers in
  household; internet subscriptions in household; age and enrollment status by computer ownership and
  internet subscription status. Some of these are also given by race and Hispanic origin.'
sql_table: '"US_OPEN_CENSUS_DATA_NEIGHBORHOOD_INSIGHTS_FREE_DATASET"."PUBLIC"."2020_CBG_B28"'
dimensions:
- name: census_block_group
