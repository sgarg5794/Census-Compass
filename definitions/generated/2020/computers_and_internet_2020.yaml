- name: no_internet_access_pct
  title: Households with no internet access (%)
  description: Percentage of households with no internet access at home.
  sql: 100 * SUM(IFF("2020_CBG_B28"."B28002e13" IS NULL OR "2020_CBG_B28"."B28002e1" IS NULL, NULL, "2020_CBG_B28"."B28002e13"))
    / NULLIF(SUM(IFF("2020_CBG_B28"."B28002e13" IS NULL OR "2020_CBG_B28"."B28002e1" IS NULL, NULL, "2020_CBG_B28"."B28002e1")),
    0)
  type: number
  format: percent
  meta:
    universe: Households
- name: no_internet_subscription_pct
  title: Households without an internet subscription (%)
  description: 'Percentage of households without an internet subscription: households with internet access
    but no paid subscription plus households with no internet access.'
  sql: 100 * SUM(IFF("2020_CBG_B28"."B28002e12" IS NULL OR "2020_CBG_B28"."B28002e13" IS NULL OR "2020_CBG_B28"."B28002e1"
    IS NULL, NULL, "2020_CBG_B28"."B28002e12" + "2020_CBG_B28"."B28002e13")) / NULLIF(SUM(IFF("2020_CBG_B28"."B28002e12"
    IS NULL OR "2020_CBG_B28"."B28002e13" IS NULL OR "2020_CBG_B28"."B28002e1" IS NULL, NULL, "2020_CBG_B28"."B28002e1")),
    0)
  type: number
  format: percent
  meta:
    universe: Households
