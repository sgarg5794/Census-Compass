name: occupation_2020
title: Occupation by sex (2020)
description: 'ACS 5-year estimates, survey answers collected 2016–2020, for each Census block group: sex
  by occupation for the civilian employed population 16 years and over; sex by occupation for the full-time,
  year-round civilian employed population 16 years and over. Some of these are also given by race and
  Hispanic origin.'
