- name: homeowner_vacancy_rate
  title: Homeowner vacancy rate
  description: 'Share of the homeowner housing stock that is vacant and for sale: vacant "for sale only"
    homes divided by owner-occupied homes plus vacant "for sale only" plus "sold, not yet occupied" homes.'
  sql: 100 * SUM(IFF("2020_CBG_B25"."B25004e4" IS NULL OR "2020_CBG_B25"."B25003e2" IS NULL OR "2020_CBG_B25"."B25004e5"
    IS NULL, NULL, "2020_CBG_B25"."B25004e4")) / NULLIF(SUM(IFF("2020_CBG_B25"."B25004e4" IS NULL OR "2020_CBG_B25"."B25003e2"
    IS NULL OR "2020_CBG_B25"."B25004e5" IS NULL, NULL, "2020_CBG_B25"."B25003e2" + "2020_CBG_B25"."B25004e4"
    + "2020_CBG_B25"."B25004e5")), 0)
  type: number
  format: percent
  meta:
    universe: Owner-occupied and for-sale housing units
- name: rental_vacancy_rate
  title: Rental vacancy rate
  description: 'Share of the rental housing stock that is vacant and for rent: vacant "for rent" homes
    divided by renter-occupied homes plus vacant "for rent" plus "rented, not yet occupied" homes.'
