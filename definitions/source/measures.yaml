# Hand-written measure templates (spec section 6.1), consumed by the builder.
#
# Columns are bare codes; the builder finds each column's physical table for the year and adds
# a one-to-one join on CENSUS_BLOCK_GROUP for any table other than the topic's own table.
# "-CODE" in a denominator subtracts that column. The builder generates the validity predicate
# (every numerator and denominator input present) and coverage SQL; never write them here.
# `for_each: race_groups` expands into one measure per race group A-I; "{race}" is replaced in
# column codes, "{slug}" and "{label}" in name, title, description and universe.
# `page` is the 2020 ACS Subject Definitions page (identical in 2019); builder metadata only.

- name: sex_ratio
  topic: population_age_and_sex
  title: Sex ratio (males per 100 females)
  description: Number of males for every 100 females.
  numerator: [B01001e2]
  denominator: [B01001e26]
  scale: 100
  format: ratio
  universe: Total population
  page: "129"

