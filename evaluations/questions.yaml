# End-to-end evaluation set (spec section 12, criterion 12).
#
# Each case: id, turns (user messages in order), expected (for the last turn), traps (spec trap ids
# and multi-turn ids), optional intermediate (expectations for earlier turns) and notes.
# expected.kind: number | refusal | clarification. Numbers carry unit, tolerance (counts exact,
# rates 0.2 percentage points, dollars and minutes 0.5%, ratios and household size 0.01) and their
# source: reference_sql (run read-only against the dataset; ratios use the spec 6.2 validity
# predicate) or a fixture reference into tests/fixtures/published. Values are 2016-2020 ACS unless
# the case says otherwise; "average income" questions map to the mean-income measures.
# must_mention / must_not are concepts for the grader, not exact substrings (except quoted numbers).
version: 2
cases:
  - id: "population_texas_acs"
    turns:
      - "According to the 2016–2020 American Community Survey, how many people lived in Texas?"
    expected:
      kind: "number"
      value: 28635442
      unit: "count"
      tolerance:
        kind: "exact"
      reference_sql: |-
        SELECT SUM("2020_CBG_B01"."B01003e1") AS VALUE,
               COUNT(*) AS BLOCK_GROUPS,
               COUNT_IF("2020_CBG_B01"."B01003e1" IS NULL) AS MISSING
        FROM "2020_CBG_B01"
        WHERE LEFT("2020_CBG_B01"."CENSUS_BLOCK_GROUP", 2) = '48'
      must_mention:
        - "ACS 2016–2020 5-year estimates"
        - "Texas"
      must_not:
        - "29,145,505"
    traps: []
  - id: "population_texas_census_count"
    turns:
      - "How many people were counted in Texas in the 2020 Census?"
    expected:
      kind: "number"
      value: 29145505
      unit: "count"
      tolerance:
        kind: "exact"
      reference_sql: |-
        SELECT SUM("P0010001") AS VALUE
        FROM "2020_REDISTRICTING_CBG_DATA"
        WHERE LEFT("2020_REDISTRICTING_CBG_DATA"."CENSUS_BLOCK_GROUP", 2) = '48'
      must_mention:
        - "2020 Census count"
        - "April 1, 2020"
      must_not:
        - "the ACS estimate 28,635,442 given as the answer"
    traps:
      - "census_count_vs_acs"
  - id: "population_and_poverty_texas_2020"
    turns:
      - "In 2020, how many people lived in Texas, and what share of them were below the poverty line?"
    expected:
      kind: "number"
      value: 28635442
      unit: "count"
      tolerance:
        kind: "exact"
      reference_sql: |-
        SELECT SUM("2020_CBG_B01"."B01003e1") AS VALUE,
               COUNT(*) AS BLOCK_GROUPS,
               COUNT_IF("2020_CBG_B01"."B01003e1" IS NULL) AS MISSING
        FROM "2020_CBG_B01"
        WHERE LEFT("2020_CBG_B01"."CENSUS_BLOCK_GROUP", 2) = '48'
      also:
        - label: "Poverty rate, Texas"
          value: 14.22
          unit: "percent"
          tolerance:
            kind: "absolute"
            amount: 0.2
          reference_sql: |-
            SELECT 100 * SUM(IFF("2020_CBG_B17"."B17021e2" IS NULL OR "2020_CBG_B17"."B17021e1" IS NULL, NULL, "2020_CBG_B17"."B17021e2"))
                   / NULLIF(SUM(IFF("2020_CBG_B17"."B17021e2" IS NULL OR "2020_CBG_B17"."B17021e1" IS NULL, NULL, "2020_CBG_B17"."B17021e1")), 0) AS VALUE,
                   SUM(IFF("2020_CBG_B17"."B17021e2" IS NULL OR "2020_CBG_B17"."B17021e1" IS NULL, NULL, "2020_CBG_B17"."B17021e1")) / NULLIF(SUM("2020_CBG_B17"."B17021e1"), 0) AS COVERAGE
            FROM "2020_CBG_B17"
            WHERE LEFT("2020_CBG_B17"."CENSUS_BLOCK_GROUP", 2) = '48'
      must_mention:
        - "ACS 2016–2020 5-year estimates"
        - "poverty"
      must_not:
        - "29,145,505"
    traps:
      - "census_count_vs_acs"
    notes: "The poverty share needs ACS, so every number in the answer comes from ACS 2016–2020 (rule C); the 2020 Census count must not be mixed in."
  - id: "population_change_texas"
    turns:
      - "How much did the population of Texas change from 2019 to 2020?"
    expected:
      kind: "number"
      value: 28635442
      unit: "count"
      tolerance:
        kind: "exact"
      reference_sql: |-
        SELECT SUM("2020_CBG_B01"."B01003e1") AS VALUE,
               COUNT(*) AS BLOCK_GROUPS,
               COUNT_IF("2020_CBG_B01"."B01003e1" IS NULL) AS MISSING
        FROM "2020_CBG_B01"
        WHERE LEFT("2020_CBG_B01"."CENSUS_BLOCK_GROUP", 2) = '48'
      also:
        - label: "Texas population, ACS 2015–2019"
          value: 28260856
          unit: "count"
          tolerance:
            kind: "exact"
          reference_sql: |-
            SELECT SUM("2019_CBG_B01"."B01003e1") AS VALUE,
                   COUNT(*) AS BLOCK_GROUPS,
                   COUNT_IF("2019_CBG_B01"."B01003e1" IS NULL) AS MISSING
            FROM "2019_CBG_B01"
            WHERE LEFT("2019_CBG_B01"."CENSUS_BLOCK_GROUP", 2) = '48'
      must_mention:
        - "ACS 2015–2019 5-year estimates"
        - "ACS 2016–2020 5-year estimates"
        - "share 4 of 5 survey years"
        - "block-group boundaries were redrawn"
        - "not a measured change"
      must_not:
        - "29,145,505"
    traps:
      - "change_2019_2020"
      - "census_count_vs_acs"
    notes: "ACS for both periods by default; the 2020 Census count is a different product."
  - id: "population_us_2015_2019"
    turns:
      - "What was the total population of the United States in the 2015–2019 survey?"
    expected:
      kind: "number"
      value: 328016242
      unit: "count"
      tolerance:
        kind: "exact"
      reference_sql: |-
        SELECT SUM("2019_CBG_B01"."B01003e1") AS VALUE,
               COUNT(*) AS BLOCK_GROUPS,
               COUNT_IF("2019_CBG_B01"."B01003e1" IS NULL) AS MISSING
        FROM "2019_CBG_B01"
        WHERE TRUE
      must_mention:
        - "ACS 2015–2019 5-year estimates"
        - "including Puerto Rico"
      must_not: []
    traps: []
  - id: "males_under_five_california"
    turns:
      - "How many boys under 5 years old lived in California, and what exactly does that figure count?"
    expected:
      kind: "number"
      value: 1233088
      unit: "count"
      tolerance:
        kind: "exact"
      reference_sql: |-
        SELECT SUM("2020_CBG_B01"."B01001e3") AS VALUE,
               COUNT(*) AS BLOCK_GROUPS,
               COUNT_IF("2020_CBG_B01"."B01001e3" IS NULL) AS MISSING
        FROM "2020_CBG_B01"
        WHERE LEFT("2020_CBG_B01"."CENSUS_BLOCK_GROUP", 2) = '06'
      must_mention:
        - "ACS 2016–2020 5-year estimates"
        - "male"
        - "under 5 years"
      must_not: []
    traps: []
    notes: "Converted from the v1 explain_field case: the answer explains the field (males under 5, ACS 2016–2020 estimate) without the user naming a Census code."
  - id: "population_wyoming_2015"
    turns:
      - "What was the population of Wyoming in 2015?"
    expected:
