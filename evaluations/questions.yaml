        reference_sql: |-
          SELECT 100 * SUM(IFF("2020_CBG_B17"."B17021e2" IS NULL OR "2020_CBG_B17"."B17021e1" IS NULL, NULL, "2020_CBG_B17"."B17021e2"))
                 / NULLIF(SUM(IFF("2020_CBG_B17"."B17021e2" IS NULL OR "2020_CBG_B17"."B17021e1" IS NULL, NULL, "2020_CBG_B17"."B17021e1")), 0) AS VALUE,
                 SUM(IFF("2020_CBG_B17"."B17021e2" IS NULL OR "2020_CBG_B17"."B17021e1" IS NULL, NULL, "2020_CBG_B17"."B17021e1")) / NULLIF(SUM("2020_CBG_B17"."B17021e1"), 0) AS COVERAGE
