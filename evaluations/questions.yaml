      - "How much do working women in Maryland earn on average?"
    expected:
      kind: "number"
      value: 53336
      unit: "dollars"
      tolerance:
        kind: "relative"
        amount: 0.005
      reference_sql: |-
        SELECT SUM(IFF("2020_CBG_B20"."B20003e5" IS NULL OR "2020_CBG_B20"."B20001e23" IS NULL, NULL, "2020_CBG_B20"."B20003e5"))
               / NULLIF(SUM(IFF("2020_CBG_B20"."B20003e5" IS NULL OR "2020_CBG_B20"."B20001e23" IS NULL, NULL, "2020_CBG_B20"."B20001e23")), 0) AS VALUE,
               SUM(IFF("2020_CBG_B20"."B20003e5" IS NULL OR "2020_CBG_B20"."B20001e23" IS NULL, NULL, "2020_CBG_B20"."B20001e23")) / NULLIF(SUM("2020_CBG_B20"."B20001e23"), 0) AS COVERAGE
        FROM "2020_CBG_B20"
        WHERE LEFT("2020_CBG_B20"."CENSUS_BLOCK_GROUP", 2) = '24'
      must_mention:
        - "ACS 2016–2020 5-year estimates"
        - "2020 dollars"
        - "with earnings"
      must_not: []
    traps: []
  - id: "housing_units_wyoming"
    turns:
      - "How many housing units are there in Wyoming?"
    expected:
      kind: "number"
      value: 278495
      unit: "count"
      tolerance:
        kind: "exact"
      reference_sql: |-
        SELECT SUM("2020_CBG_B25"."B25001e1") AS VALUE,
               COUNT(*) AS BLOCK_GROUPS,
               COUNT_IF("2020_CBG_B25"."B25001e1" IS NULL) AS MISSING
        FROM "2020_CBG_B25"
        WHERE LEFT("2020_CBG_B25"."CENSUS_BLOCK_GROUP", 2) = '56'
      block_groups: 457
      missing_block_groups: 0
      must_mention:
        - "ACS 2016–2020 5-year estimates"
      must_not: []
    traps: []
