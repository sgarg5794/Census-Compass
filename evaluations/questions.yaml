               SUM(IFF("2019_CBG_B17"."B17021e2" IS NULL OR "2019_CBG_B17"."B17021e1" IS NULL, NULL, "2019_CBG_B17"."B17021e1")) / NULLIF(SUM("2019_CBG_B17"."B17021e1"), 0) AS COVERAGE
