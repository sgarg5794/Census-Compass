               / NULLIF(SUM(IFF("2020_CBG_B19"."B19025e1" IS NULL OR "2020_CBG_B19"."B19001e1" IS NULL, NULL, "2020_CBG_B19"."B19001e1")), 0) AS VALUE,
               SUM(IFF("2020_CBG_B19"."B19025e1" IS NULL OR "2020_CBG_B19"."B19001e1" IS NULL, NULL, "2020_CBG_B19"."B19001e1")) / NULLIF(SUM("2020_CBG_B19"."B19001e1"), 0) AS COVERAGE
        FROM "2020_CBG_B19"
