               COUNT_IF("2019_CBG_B01"."B01003e1" IS NULL) AS MISSING
        FROM "2019_CBG_B01"
        WHERE LEFT("2019_CBG_B01"."CENSUS_BLOCK_GROUP", 2) = '56'
      must_mention:
        - "ACS 2015–2019 5-year estimates"
        - "2015"
      must_not: []
