# DRAFT for review — topic mapping for LLM-facing semantic files (not yet used by any code).
#
# Rules (checked automatically against data/tables/*.yaml for 2019 and 2020):
#   - every Census group is assigned to exactly one topic (2019 lacks B28012; otherwise identical)
#   - a topic reads from one physical table only (`table`; year prefix added per year: 2020_CBG_B25)
#   - every hand-written (derived) measure uses only columns from its own topic, except
#     measures that declare a join: per_capita_income (→ population_age_and_sex) and the
#     nine mean_household_income_<race> measures (→ housing_occupancy_and_tenure)
#   - race versions (A–I) stay with their base group. E (Native Hawaiian and Other Pacific
#     Islander alone) is missing from the database dictionary; its descriptions come from the
#     official Census API (api.census.gov/data/{year}/acs/acs5/groups/{group}.json), verified:
#     148/148 columns per year match; naming rule checked 148/148 on documented A groups.
#   - excluded physical tables: 2019_CBG_PATTERNS, 2019_RENT_PERCENTAGE_HOUSEHOLD_INCOME,
#     2019_TOTAL_RENTAL_GEO, 2019_CBG_B99, 2020_CBG_B99 (geometry tables are never queried)
#
# Group codes are listed only so the builder can use them; the comment gives the meaning.

- name: population_age_and_sex
  title: "Population by age and sex"
  table: CBG_B01
  groups:
    - B01001  # Sex By Age
    - B01002  # Median Age By Sex  (+ race versions A, B, C, D, E, F, G, H, I)
    - B01003  # Total Population
  derived_measures:
    - sex_ratio
    - age_dependency_ratio

