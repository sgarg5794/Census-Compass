# User-approved v1 design example. Active generated definition: data/tables/2020_CBG_B01.yaml.
version: 1
name: population_age_and_sex_2020
description: 2020-labeled Census block-group population estimates, sex-by-age counts, and published median ages.
  Includes total population and male/female age categories, plus median age by sex for the total population and
  available race/ethnicity groups. Source definitions come from the same-year field dictionary. The exact reporting
  period remains to be verified for this physical table; the year label alone is not a single-date population count.
source_table: '"US_OPEN_CENSUS_DATA_NEIGHBORHOOD_INSIGHTS_FREE_DATASET"."PUBLIC"."2020_CBG_B01"'
grain:
  description: One row per Census block group.
  primary_key:
  - census_block_group
  verification: Unique, non-null identifiers confirmed in the earlier live join audit.
dimensions:
  census_block_group:
    description: Census block-group geographic identifier for the area summarized by this row.
    data_type: string
    source_data_type: TEXT
    sql: '"CENSUS_BLOCK_GROUP"'
    constraints:
    - Preserve leading zeros; treat as an identifier, not a number.
    metadata:
      source_column: CENSUS_BLOCK_GROUP
      description_source: Project geographic interpretation; absent from field dictionary.
      embedding_eligible: false
measures:
  population:
    description: 'Estimate. Sex By Age. Universe: Total population. Breakdown: Total.'
    data_type: number
    source_data_type: FLOAT
    unit: people
    universe: Total population
    sql: '"B01001e1"'
    aggregation:
      allowed:
        sum:
          meaning: Total for this population category across the selected block groups.
        avg:
          meaning: Average count for this category per selected block group; not average age.
        min:
          meaning: Smallest block-group estimate for this category among selected block groups.
        max:
          meaning: Largest block-group estimate for this category among selected block groups.
    margin_of_error:
      sql: '"B01001m1"'
      description: 'MarginOfError. Sex By Age. Universe: Total population. Breakdown: Total.'
      data_type: number
      unit: people
      aggregation:
        allowed: {}
      constraints:
      - Do not apply the estimate aggregation to this margin of error.
      - Combined uncertainty requires a separately verified statistical method; none is configured.
      - An available estimate does not guarantee an available margin of error.
      metadata:
        source_column: B01001m1
        metadata_status: available
    constraints:
      explanation: SUM combines the same category across distinct block groups. AVG describes the average block-group
        count. MIN/MAX describe extrema of block-group estimates, not the population total of a larger geography.
    metadata:
      source_column: B01001e1
      census_table_code: B01001
      census_table_title: Sex By Age
      field_path:
      - Estimate
      - SEX BY AGE
      - Total population
      - Total
      metadata_status: available
      embedding_eligible: true
