[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "census-compass"
version = "0.1.0"
description = "A conversational agent for exploring US Census data in Snowflake."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "google-adk",
    "litellm",
    "anthropic",
    "lancedb",
    "snowflake-connector-python",
    "pydantic>=2",
    "pydantic-settings",
    "python-dotenv",
    "PyYAML",
    "jsonschema",
    "sqlglot",
]

[project.optional-dependencies]
ui = ["streamlit"]
local = ["keyring"]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.setuptools.packages.find]
include = ["census_compass*"]

[tool.setuptools.package-data]
census_compass = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
